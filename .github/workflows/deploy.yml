# Cuts a GitHub release from a version tag.
# Nothing leaves the repository: no Maven, no CurseForge, no Modrinth.

name: Deploy

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Read the mod id, name and version
        id: mod
        run: |
          read_property() {
            grep -m1 -E "^[[:space:]]*$1[[:space:]]*=" gradle.properties | cut -d '=' -f 2- | awk '{$1=$1};1'
          }
          {
            echo "id=$(read_property mod_id)"
            echo "name=$(read_property mod_name)"
            echo "version=$(read_property mod_version)"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse a tag that does not match mod_version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.mod.outputs.version }}
        run: |
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match mod_version $VERSION in gradle.properties"
            exit 1
          fi

      - name: Build the mod
        run: ./gradlew --no-daemon build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          MOD_NAME: ${{ steps.mod.outputs.name }}
          JAR: build/libs/${{ steps.mod.outputs.id }}-${{ steps.mod.outputs.version }}.jar
        run: |
          test -f "$JAR"
          gh release create "$TAG" --title "$MOD_NAME $TAG" --generate-notes "$JAR"
